services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fit
      POSTGRES_USER: fit
      POSTGRES_PASSWORD: fit
    ports:
      - "5432:5432"
    volumes:
      - fit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fit -d fit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fit_postgres_data:
