[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuck-inside-traders"
version = "0.1.0"
description = "Dry-run cross-market anomaly radar for prediction markets, asset prices, and public headlines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10",
  "fastapi>=0.110",
  "feedparser>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "sqlalchemy>=2.0",
  "streamlit>=1.36",
  "uvicorn>=0.29",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["fuck_inside_traders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
